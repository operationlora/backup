<div class="row newsletter-section">
  <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
    <div class="text-center">
      <h4>SUBSCRIBE TO RECEIVE POSTS DIRECTLY TO YOUR INBOX</h4>
    </div>

    {%- assign bd_user = site.buttondown_username | default: 'yourname' -%}

    <form class="newsletter-form"
          action="https://buttondown.email/api/emails/embed-subscribe/{{ bd_user }}"
          method="post"
          target="popupwindow"
          onsubmit="window.open('https://buttondown.email/{{ bd_user }}','popupwindow','scrollbars=yes,width=800,height=600');return true">
      <input class="newsletter-input" type="email" placeholder="Enter your email address" name="email" id="bd-email" aria-label="Email address" required>
      <input type="hidden" name="embed" value="1">
      <input class="newsletter-submit" type="submit" value="Get notified!">
    </form>

    {%- if bd_user == 'yourname' -%}
      <p class="text-center" style="opacity:.75;margin-top:.5rem;">
        Set <code>buttondown_username</code> in <code>_config.yml</code> to enable this form.
      </p>
    {%- endif -%}
  </div>
  
</div>
