# Site settings
title: PHOTORAMA
email: ""
description: "Photo Journal"
# Set to your GitHub Pages user URL (no trailing slash)
url: "https://operationlora.github.io"
baseurl: ""
facebook_username: ""
twitter_username: ""
instagram_username: ""
github_username:  ""
deviantart_username: ""
flickr_username: ""
youtube_username: ""
discus_shortname: ""
share: true

# Owner/author information
owner:
  name:   photorama
  avatar: avatar.png
  favicon: favicon.ico
  info: photography website template

# Commerce
currency: USD
currency_symbol: "$"

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
comments :
  provider : disqus
  disqus :
    short_name : ""

# Internal nav
nav:
  - GALLERY: "/gallery/"
  - JOURNAL: "/journal/"
  - ABOUT: "/about/"
  - SHOP: "/shop/"
  - PRIVACY: "/privacy/"
  - TERMS: "/terms/"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: "/journal/:year/:month/:day/:title/"
paginate: 6
paginate_path: "/journal/page:num/"
categories_path: "/journal/category/"
tags_path: "/journal/tag/"
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# Runtime toggles
# Set to false to attempt running without jQuery Migrate (recommended once pages are clean)
jquery_migrate: false

# Include hidden directories (for well-known endpoints)
include:
  - .well-known

# Add shop collection for hot-pluggable Shop tab
collections:
  shop:
    output: true
    permalink: /shop/:path/

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"
