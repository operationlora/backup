---
layout: page
title: "SHOP"
description: "shop archive"
active: shop
header-img: "img/gallery-bg.jpg"
---

<section id="content" role="main">
  <div class="wrapper">
    <h2>{{ page.title }}</h2>
    <div class="photorama-shop-grid">
      {% for item in site.shop %}
        <div class="photorama-shop-item">
          <a href="{{ site.url }}{{ site.baseurl }}{{ item.url }}">
            <img src="{{ site.url }}{{ site.baseurl }}{{ item.image }}">
            <h3>{{ item.product_name }}</h3>
            <p>¥{{ item.product_price }}</p>
          </a>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
